# ─────────────────────────────────────────────────────────────
# TPM Plugins
# ─────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# ─────────────────────────────────────────────────────────────
# Terminal / Neovim friendliness
# ─────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"

# True color support
set -ga terminal-overrides ",alacritty:RGB"
set -ga terminal-overrides ",xterm-256color:RGB"
set -ga terminal-overrides ",*256col*:RGB"

# Undercurl support for Neovim/LSP diagnostics
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Important for Neovim
set -g focus-events on
set -sg escape-time 0

# ─────────────────────────────────────────────────────────────
# General UX
# ─────────────────────────────────────────────────────────────
set -g mouse on
set -g history-limit 100000
set -g display-time 2000
set -g status-interval 5

# Window numbering
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# Window titles
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#S: #W'

# Vi-style keys
set -g status-keys vi
setw -g mode-keys vi

# Activity
setw -g monitor-activity on
set -g visual-activity off

# Status lengths
set -g status-left-length 100
set -g status-right-length 100

# ─────────────────────────────────────────────────────────────
# Prefix
# ─────────────────────────────────────────────────────────────
# Keep C-a as prefix.
# If you prefer the default C-b again, comment these lines.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ─────────────────────────────────────────────────────────────
# Reload config
# ─────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display-message "Reloaded tmux config"

# ─────────────────────────────────────────────────────────────
# Splits / Windows / Panes
# ─────────────────────────────────────────────────────────────
# Intuitive splits, preserving current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-like pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Move windows left/right
bind -r ( swap-window -t -1 \; select-window -t -1
bind -r ) swap-window -t +1 \; select-window -t +1

# Quickly jump to last window
bind Tab last-window

# Clear scrollback
bind C-l clear-history

# Safer kills
bind q confirm-before -p "Kill pane? (y/n)" kill-pane
bind Q confirm-before -p "Kill window? (y/n)" kill-window
bind X confirm-before -p "Kill session #S? (y/n)" kill-session

# ─────────────────────────────────────────────────────────────
# Sessions
# ─────────────────────────────────────────────────────────────
# Create or attach to a named session
bind S command-prompt -p "New session name:" "new-session -A -s '%%'"

# Nice session picker
bind s choose-tree -Z
bind C-s choose-tree -Z

# ─────────────────────────────────────────────────────────────
# Copy mode / clipboard
# ─────────────────────────────────────────────────────────────
bind Escape copy-mode

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Wayland clipboard
if-shell 'test -n "$WAYLAND_DISPLAY"' \
  "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'" \
  "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard'"

# Mouse copy support
if-shell 'test -n "$WAYLAND_DISPLAY"' \
  "bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wl-copy'" \
  "bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard'"

# ─────────────────────────────────────────────────────────────
# Resurrect / Continuum
# ─────────────────────────────────────────────────────────────
# Save/restore Tmux layout, programs, and working directories.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'

# Automatically save every 15 minutes
set -g @continuum-save-interval '15'

# Automatically restore when Tmux starts
set -g @continuum-restore 'on'

# ─────────────────────────────────────────────────────────────
# Theme
# ─────────────────────────────────────────────────────────────
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_status_modules_right 'session directory'
set -g @catppuccin_status_left_separator '█'
set -g @catppuccin_status_right_separator '█'

# ─────────────────────────────────────────────────────────────
# Neovim-aware pane switching
# ─────────────────────────────────────────────────────────────
# This allows C-h/j/k/l to move between Neovim splits and Tmux panes.
# If you do not like this, comment out these four lines.
bind-key -n C-h if-shell "~/.tmux/scripts/is-vim.sh '#{pane_tty}'" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "~/.tmux/scripts/is-vim.sh '#{pane_tty}'" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "~/.tmux/scripts/is-vim.sh '#{pane_tty}'" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "~/.tmux/scripts/is-vim.sh '#{pane_tty}'" "send-keys C-l" "select-pane -R"

# ─────────────────────────────────────────────────────────────
# TPM initialization
# KEEP THIS AT THE VERY BOTTOM
# ─────────────────────────────────────────────────────────────
run '~/.tmux/plugins/tpm/tpm'

# Load local overrides last, after plugins

# Load local overrides last, after plugins
source-file ~/.tmux/local.conf
