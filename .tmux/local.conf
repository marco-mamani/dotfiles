# ─────────────────────────────────────────────────────────────
# Tmux local overrides
# ─────────────────────────────────────────────────────────────

# Force Tmux to use Zsh
set -g default-shell /usr/bin/zsh
set -g default-command ""

# ─────────────────────────────────────────────────────────────
# Window naming
# ─────────────────────────────────────────────────────────────
# Smart automatic window names:
# - if current command is zsh, show current directory
# - otherwise show current command, e.g. nvim, node, npm, git
setw -g automatic-rename on
setw -g automatic-rename-format "#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command}}"

# Prevent applications from randomly renaming windows
set -g allow-rename off

# ─────────────────────────────────────────────────────────────
# Sticky manual rename
# ─────────────────────────────────────────────────────────────
# Ctrl-a , or Ctrl-a N -> rename window and make the name stick
# Ctrl-a A             -> return to automatic naming
bind , command-prompt -p "Window name:" "rename-window '%%' \; set-option -w automatic-rename off"
bind N command-prompt -p "Window name:" "rename-window '%%' \; set-option -w automatic-rename off"
bind A set-option -w automatic-rename on

# ─────────────────────────────────────────────────────────────
# Restore normal Ctrl+h/j/k/l terminal behavior
# ─────────────────────────────────────────────────────────────
# This is important for Ctrl+l clearing the terminal.
unbind -n C-h
unbind -n C-j
unbind -n C-k
unbind -n C-l

# Explicitly allow Ctrl+l to be sent to the shell/application
bind-key -n C-l send-keys C-l

# Prefix Ctrl+l clears Tmux scrollback/history
bind C-l clear-history

# ─────────────────────────────────────────────────────────────
# Active window highlight
# ─────────────────────────────────────────────────────────────
set -g status on
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 100

# Inactive windows
set -g window-status-format "#[fg=#6c7086,bg=#181825] #I:#W "

# Active window
set -g window-status-current-format "#[fg=#11111b,bg=#89b4fa,bold] #I:#W "

# Optional: also make active pane border easier to see
set -g pane-border-style fg=#45475a
set -g pane-active-border-style fg=#89b4fa
