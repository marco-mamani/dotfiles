# ─────────────────────────────────────────────────────────────
# Tmux local overrides
# ─────────────────────────────────────────────────────────────

# Force Tmux to use Zsh
set -g default-shell /usr/bin/zsh
set -g default-command ""

# ─────────────────────────────────────────────────────────────
# Window naming
# ─────────────────────────────────────────────────────────────
setw -g automatic-rename on
setw -g automatic-rename-format "#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command}}"
set -g allow-rename off

# ─────────────────────────────────────────────────────────────
# Sticky manual rename
# ─────────────────────────────────────────────────────────────
# Ctrl-a , or Ctrl-a N -> rename window and show current name for editing
# Ctrl-a A             -> return to automatic naming
bind , command-prompt -p "Rename window:" -I "#{window_name}" "rename-window '%%' \; set-option -w automatic-rename off"
bind N command-prompt -p "Rename window:" -I "#{window_name}" "rename-window '%%' \; set-option -w automatic-rename off"
bind A set-option -w automatic-rename on

# ─────────────────────────────────────────────────────────────
# Restore normal Ctrl+h/j/k/l terminal behavior
# ─────────────────────────────────────────────────────────────
unbind -n C-h
unbind -n C-j
unbind -n C-k
unbind -n C-l

# Allow Ctrl+l to clear terminal normally
bind-key -n C-l send-keys C-l

# Prefix Ctrl+l clears Tmux scrollback/history
bind C-l clear-history

# ─────────────────────────────────────────────────────────────
# Visual feedback
# ─────────────────────────────────────────────────────────────
set -g display-time 1500
set -g message-style fg=#11111b,bg=#f9e2af,bold
set -g message-command-style fg=#11111b,bg=#f9e2af,bold

# ─────────────────────────────────────────────────────────────
# Active window highlight
# ─────────────────────────────────────────────────────────────
set -g status on
set -g status-interval 1
set -g status-right-length 100

# Inactive windows

# Active window

# Active pane border
set -g pane-border-style fg=#45475a
set -g pane-active-border-style fg=#89b4fa

# ─────────────────────────────────────────────────────────────
# Prefix/session indicator
# ─────────────────────────────────────────────────────────────
# Safe format without comma-escaping issues.
# Shows C-a while prefix is active, otherwise shows session name.

# ─────────────────────────────────────────────────────────────
# Zoom indicator
# ─────────────────────────────────────────────────────────────

# Show Z in window list when window/pane is zoomed

# Show ZOOM on the left side when current pane is zoomed

# Show a message when zooming/unzooming

# ─────────────────────────────────────────────────────────────
# Zoom indicator with icon
# ─────────────────────────────────────────────────────────────

# Show icon in window list when window/pane is zoomed

# Show icon on the left side when current pane is zoomed

# Show a message when zooming/unzooming
bind z resize-pane -Z \; display-message "#{?window_zoomed_flag,Pane zoomed in,Pane zoomed out}"
bind Z resize-pane -Z \; display-message "#{?window_zoomed_flag,Pane zoomed in,Pane zoomed out}"

# ─────────────────────────────────────────────────────────────
# Zoom icon only next to window name
# ─────────────────────────────────────────────────────────────

# Inactive window: show magnifying glass when zoomed

# Active window: show magnifying glass when zoomed

# Left status without zoom indicator

# ─────────────────────────────────────────────────────────────
# Zoom-in icon (magnifying glass +) only next to window name
# ─────────────────────────────────────────────────────────────

# Inactive window
set -g window-status-format "#[fg=#6c7086,bg=#181825] #I:#W #{?window_zoomed_flag,#[reverse]  #[default] ,}"

# Active window
set -g window-status-current-format "#[fg=#11111b,bg=#89b4fa,bold] #I:#W #{?window_zoomed_flag,#[reverse]  #[default] ,}"

# Left status without zoom indicator
set -g status-left-length 60
set -g status-left "#{?client_prefix,#[reverse] C-a #[default],#[bold] #S #[default]} "

# ─────────────────────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────
# Ctrl-a n  -> today's daily note
# Ctrl-a m  -> scratch note
# Ctrl-a C-n -> create/open a named note
# Ctrl-a o  -> fuzzy open an existing note

# ─────────────────────────────────────────────────────────────
# Quick notes
# ─────────────────────────────────────────────────────────────
bind n display-popup -E -w 80% -h 80% $HOME/.tmux/scripts/note.sh
bind m display-popup -E -w 80% -h 80% $HOME/.tmux/scripts/note.sh scratch
bind o display-popup -E -w 80% -h 80% $HOME/.tmux/scripts/note-picker.sh
bind C-n command-prompt -p "Note name:" "display-popup -E $HOME/.tmux/scripts/note.sh '%%'"
